<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelf Experiment</title>
<style>
@font-face {
  font-family: 'SabonLTPro';
  src: url('fonts/SabonLTPro-Roman.woff2') format('woff2'),
       url('fonts/SabonLTPro-Roman.woff') format('woff');
  font-weight: 400;
  font-style: normal;
}

:root {
  --ground: #360816;   /* ground */
  --material: #ffef91; /* all shelf material: front face + receding walls */
  --note: #ffef91;     /* mini-note plates */
  --line: #360816;     /* cubby-interior fill + note-card text */
  --ink: #2f73f7;      /* borders and grid-drawing lines */
  --shelf-ratio: 3 / 2; /* fixed width:height of the whole shelf */
  --line-weight: 2px;  /* uniform thickness for outer border, column dividers, and inner seams */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--ground);
  font-family: 'SabonLTPro', 'Times New Roman', Georgia, serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Locked to --shelf-ratio and scaled to the largest size that fits
   inside the viewport on either axis, so the whole composition (and
   everything inside it, sized in % / fr / non-scaling-stroke) scales
   uniformly instead of stretching to match the window's own shape. */
.backdrop {
  width: min(100vw, 100vh * (3 / 2));
  height: min(100vh, 100vw * (2 / 3));
  aspect-ratio: var(--shelf-ratio);
  display: grid;
  grid-template-rows: 6% 1fr;
  padding: 0 6% 4%;
  background: var(--ground);
}

.backdrop-title {
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  padding-bottom: 0.4em;
  min-width: 0;
  min-height: 0;
}

.backdrop-title-text {
  font-family: 'SabonLTPro', 'Times New Roman', Georgia, serif;
  font-feature-settings: "smcp" 1, "c2sc" 1;
  font-size: 1.8rem;
  line-height: 1.3;
  letter-spacing: 2px;
  color: var(--ink);
}

/* CSS Grid (not flexbox) for both axes: browsers snap grid track
   boundaries to whole device pixels even when track sizes are
   fractional, which flexbox does not guarantee -- that gap was the
   source of the inconsistent hairlines between cells. */

.shelf {
  position: relative;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  width: 100%;
  height: 100%;
}

.shelf::after {
  content: '';
  position: absolute;
  z-index: 10;
  inset: 0;
  border: var(--line-weight) solid var(--ink);
  pointer-events: none;
}

.shelf-col {
  position: relative;
  display: grid;
  min-width: 0;
  min-height: 0; /* without this, a row's content min-size can push it past its 1fr share and overflow the viewport */
  background: var(--material); /* masks subpixel row-track rounding gaps with the fill color that meets them, now that .cubby-wrap no longer has a border-bottom to cover the seam */
}

.shelf-col--3 { grid-template-rows: repeat(3, 1fr); }
.shelf-col--4 { grid-template-rows: repeat(4, 1fr); }

/* Each cubby is just blue ground with one SVG line drawing on top: a
   yellow frame shape (outer cell rect minus an inner rect, so it reads as
   solid material) plus black strokes for every seam -- the front face's
   inner edge, the depth wall's inner edge, and the four mitered diagonals
   connecting them. Depth (how far the inner rect is inset per side) tapers
   by grid position: more inset toward the outer edges of the whole shelf,
   less toward its center. The front face inset (6 units) never changes. */

.cubby-wrap {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: var(--material); /* matches the SVG fill so sub-pixel antialiasing at the fill's own edge blends into itself instead of showing the ground color through a hairline */
  border-right: var(--line-weight) solid var(--ink);
}

.cubby-wrap svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.cubby-wrap svg .fill { fill: var(--material); }
/* stroke-width is intentionally > 1: a true 1px line lands on a fractional
   device pixel more often than not, so antialiasing splits it into two
   faint ~50%-opacity rows instead of one solid one. The extra width makes
   that split still add up to full coverage, so every seam -- straight or
   diagonal -- renders as one solid line instead of a blurry ghost of it. */
.cubby-wrap svg .seam { fill: none; stroke: var(--ink); stroke-width: var(--line-weight); vector-effect: non-scaling-stroke; }
.cubby-wrap svg .seam-inner { fill: var(--line); }

.cubby-content {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.cubby-content img {
  display: block;
  max-width: 60%;
  max-height: 60%;
  object-fit: contain;
}

/* pottery fragment: pulled from the main site's .cell-fragment treatment,
   sitting in the middle cubby, horizontally centered, with its lower edge
   dipping slightly past the interior cutout into the cell's own material band. */
.cubby-fragment {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: 5%;
  transform: translateX(-50%) rotate(70deg);
  width: 50%;
  aspect-ratio: 900 / 869;
  height: auto;
  pointer-events: none;
}

/* Henry James ghost book cover: narrower than the interior cutout so
   yellow ground shows on both sides, bottom-aligned to the cell's own
   bottom border line (front face and back cutout coincide there in
   this cell, so it's a single line rather than a receding band). */
.cubby-book-cover {
  position: absolute;
  z-index: 2;
  left: 60%;
  bottom: 6%;
  transform: translateX(-50%);
  width: 55%;
  height: auto;
  max-height: 80%;
  object-fit: contain;
  pointer-events: none;
}

/* sits on the seam between two stacked cubbies in the middle column,
   straddling the blue material band that reads as continuous across
   both cells' frames since it shares their fill color. */
.shelf-col-title {
  position: absolute;
  left: 50%;
  z-index: 5;
  transform: translate(-50%, -50%);
  font-family: 'SabonLTPro', 'Times New Roman', Georgia, serif;
  font-feature-settings: "smcp" 1, "c2sc" 1;
  font-size: 0.9rem;
  letter-spacing: 1.5px;
  color: var(--line);
  white-space: nowrap;
  pointer-events: none;
}

.shelf-col-title--upper { top: 33.3333%; }
.shelf-col-title--lower { top: 66.6667%; }

@media screen and (max-width: 600px) {
  html, body { overflow: visible; }
  body { display: block; }
  .backdrop {
    width: 100%;
    height: auto;
    min-height: 100vh;
    aspect-ratio: auto;
    grid-template-rows: auto 1fr;
    padding: 0 10vw 10vh;
  }
  .backdrop-title {
    padding: 10vh 0 2vh;
  }
  .shelf { grid-template-columns: 1fr; }
  .shelf-col { height: 100vh; }
}
</style>
</head>
